[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshotlegal-agentic"
version = "0.2.0"
description = "Standalone staged evidence reasoning harness with packaged skills, tools and HTML reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
agentic-report = "agentic.examples.report:main"

[tool.setuptools]
packages = ["agentic", "agentic.adapters", "agentic.examples", "agentic.builtin"]
package-dir = {agentic = "."}

[tool.setuptools.package-data]
agentic = ["docs/*.md", "docs/*.json", "examples/*.json", "examples/*.example", "prompts/*.md", "templates/*.html", "templates/*.css", "templates/*.js", "builtin/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
