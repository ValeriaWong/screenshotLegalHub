<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件库 · Legal Evidence</title><link rel="stylesheet" href="/case.css"><link rel="stylesheet" href="/hub.css"></head><body class="hub-body">
<header class="app-header"><a class="brand" href="/"><span class="brand-mark">证</span><span><span id="brand-label">案件证据工作台</span><small>LEGAL EVIDENCE WORKSPACE</small></span></a><div class="header-actions"><a class="quiet-link" href="/library" id="legacy-link">资料库</a><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select><button class="primary" id="new-case">＋ 新建案件</button></div></header>
<main class="hub-main"><section class="hub-hero"><div><div class="eyebrow">EVIDENCE, CONNECTED</div><h1 id="hero-title"></h1><p id="hero-copy"></p><div class="hero-actions"><button class="primary" id="hero-new"></button><a class="button" href="/case?case_id=5ad6f87311be1056f7197a9f" id="demo-link"></a></div></div><div class="evidence-orbit" aria-hidden="true"><svg viewBox="0 0 430 180"><path d="M55 120 C150 0 280 180 385 45" class="orbit-path"/><circle r="5" fill="#16b3ae"><animateMotion dur="5s" repeatCount="indefinite" path="M55 120 C150 0 280 180 385 45"/></circle></svg><div class="orbit-card orbit-source"><span>01 / SOURCE</span><b>截图原文</b><i></i><i></i><i></i></div><div class="orbit-card orbit-meaning"><span>02 / MEANING</span><b>法律意义</b><i></i><i></i></div><div class="orbit-card orbit-citation"><span>03 / CITATION</span><b>可追溯引用 ↗</b><i></i></div></div></section>
<section class="hub-metrics" id="hub-metrics"></section>
<div class="hub-layout"><aside class="hub-sidebar"><h2 id="collections-title"></h2><nav id="case-filters"></nav><div class="sidebar-note" id="classification-note"></div></aside><section class="hub-collection"><div class="collection-heading"><div><div class="eyebrow">CASE COLLECTION</div><h2 id="collection-title"></h2><p id="collection-subtitle"></p></div><label class="hub-search"><span>⌕</span><input id="case-query" autocomplete="off"></label></div><div id="case-grid" class="case-grid"></div><div class="hub-pagination"><span id="page-count"></span><div><button id="previous-page">←</button><button id="next-page">→</button></div></div><p id="hub-status" role="status"></p></section></div></main>
<dialog id="create-dialog"><form id="create-form"><div class="dialog-heading"><div><div class="eyebrow">NEW CASE</div><h2 id="create-title"></h2></div><button type="button" id="create-close">×</button></div><label class="form-field"><span id="name-label"></span><input id="case-name" maxlength="120"></label><div id="drop-zone" tabindex="0" role="button"><div class="drop-icon">＋</div><strong id="drop-title"></strong><span id="drop-copy"></span><input type="file" id="case-files" accept="image/jpeg,image/png,image/webp" multiple hidden></div><div id="upload-previews"></div><label class="form-field"><span id="context-label"></span><textarea id="case-context" rows="4" maxlength="12000"></textarea></label><p id="intake-note"></p><p id="create-status" role="status"></p><div class="create-actions"><button type="button" id="create-cancel"></button><button type="submit" class="primary" id="create-submit"></button></div></form></dialog>
<script src="/case-i18n.js"></script><script src="/hub.js"></script></body></html>
