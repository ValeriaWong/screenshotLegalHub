<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法律批注 · Legal Evidence</title><link rel="stylesheet" href="/case.css"><link rel="stylesheet" href="/workbench-theme.css"><link rel="stylesheet" href="/review.css"></head>
<body class="review-body">
<a class="skip-link" href="#assertion-panel" data-review-i18n="skip">跳至判断</a>
<header class="app-header"><a class="brand" href="/"><span class="brand-mark">证</span><span><span data-review-i18n="brand">案件证据工作台</span><small>LEGAL EVIDENCE WORKSPACE</small></span></a><nav class="header-actions" aria-label="Workspace"><a class="quiet-link" href="/" data-review-i18n="cases">案件库</a><a class="quiet-link" id="review-case-link" href="/" data-review-i18n="workbench">案件工作台</a><a class="quiet-link active" href="/review" aria-current="page" data-review-i18n="review">法律批注</a><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></nav></header>
<main class="review-main">
<section class="review-heading"><div><div class="eyebrow">EVIDENCE REVIEW</div><h1 data-review-i18n="title">逐项核对，让判断有据可依。</h1><p class="review-slogan">让每一项判断，回到证据。</p></div><div class="review-progress"><strong id="review-progress-label">—</strong><progress id="review-progress" max="1" value="0" aria-label="Review progress"></progress><span id="review-progress-detail"></span></div></section>
<form class="review-filters" id="review-filters"><label><span data-review-i18n="caseFilter">案件</span><select id="review-case"><option value="" data-review-i18n="allCases">全部案件</option></select></label><label><span data-review-i18n="kindFilter">类型</span><select id="review-kind"><option value="" data-review-i18n="allKinds">全部类型</option></select></label><label><span data-review-i18n="statusFilter">状态</span><select id="review-filter-status"><option value="pending" data-review-i18n="pending">待批注</option><option value="all" data-review-i18n="allStatuses">全部状态</option><option value="confirmed" data-review-i18n="confirmed">已确认</option><option value="amended" data-review-i18n="amended">已修订</option><option value="rejected" data-review-i18n="rejected">已驳回</option><option value="deferred" data-review-i18n="deferred">稍后复核</option><option value="stale" data-review-i18n="stale">原文已变更</option></select></label><button type="button" id="review-refresh" data-review-i18n="refresh">刷新</button><a id="review-export" class="button" href="/api/review/export" data-review-i18n="export">导出批注</a></form>
<div class="review-mobile-tabs" role="tablist" aria-label="Review panels"><button type="button" role="tab" data-panel="queue" aria-selected="false" data-review-i18n="queue">待办队列</button><button type="button" role="tab" data-panel="evidence" aria-selected="true" data-review-i18n="evidence">原始证据</button><button type="button" role="tab" data-panel="assertion" aria-selected="false" data-review-i18n="assertion">判断与批注</button></div>
<div id="review-status" class="review-status" role="status" aria-live="polite"></div>
<div class="review-layout" data-active-panel="evidence">
<aside class="review-panel queue-panel" id="queue-panel"><div class="review-panel-heading"><h2 data-review-i18n="queue">待办队列</h2><span id="queue-total" class="count-pill">0</span></div><div id="review-queue" aria-label="Review queue"></div><div class="queue-pagination"><button id="review-previous-page" type="button" aria-label="Previous page">←</button><span id="review-page"></span><button id="review-next-page" type="button" aria-label="Next page">→</button></div></aside>
<section class="review-panel evidence-panel" id="evidence-panel"><div class="review-panel-heading"><div><h2 data-review-i18n="evidence">原始证据</h2><p id="source-meta"></p></div><button type="button" id="review-enlarge" data-review-i18n="enlarge">放大原图</button></div><div id="source-tabs" class="source-tabs" role="tablist" aria-label="Evidence sources"></div><p id="source-coverage" class="coverage-note"></p><div id="review-image" class="review-source-view"></div><section class="verbatim-section"><h3 data-review-i18n="quote">原文引用</h3><blockquote id="review-quote"></blockquote></section><section class="adjacent-section"><h3 data-review-i18n="context">相邻上下文</h3><div id="review-context"></div></section></section>
<section class="review-panel assertion-panel" id="assertion-panel" tabindex="-1"><div class="review-panel-heading"><h2 data-review-i18n="assertion">判断与批注</h2><span id="assertion-status" class="status-pill"></span></div><div class="review-actions" id="review-action-toolbar" hidden><button type="button" id="review-confirm" class="primary" data-decision="confirmed"><span data-review-i18n="confirm">确认</span><kbd>1</kbd></button><button type="submit" id="review-amend" form="review-editor" data-decision="amended"><span data-review-i18n="amend">保存修订</span><kbd>2</kbd></button><button type="button" id="review-reject" data-decision="rejected"><span data-review-i18n="reject">驳回</span><kbd>3</kbd></button><button type="button" id="review-defer" data-decision="deferred"><span data-review-i18n="defer">稍后复核</span><kbd>4</kbd></button></div><div id="review-empty"></div><div id="review-detail" hidden><div class="assertion-meta"><span id="assertion-kind"></span><span id="assertion-origin"></span></div><h3 id="assertion-title"></h3><div class="assertion-text" id="assertion-text"></div><details id="original-assertion" hidden><summary data-review-i18n="previousText">修订前的判断</summary><p id="assertion-original"></p></details><section class="rationale-card"><h3 data-review-i18n="rationale">判断依据</h3><div id="assertion-rationale"></div></section><details id="review-law-basis" class="review-law-basis" hidden><summary data-review-i18n="legalBasis">Legal basis</summary><p data-review-i18n="lawVersionHint"></p><div id="review-laws"></div></details><section id="review-assistance" class="review-assistance" hidden></section><form id="review-editor"><label for="review-edited-text" data-review-i18n="editLabel">修订判断</label><textarea id="review-edited-text" rows="5"></textarea><label for="review-note" data-review-i18n="noteLabel">批注说明（可选）</label><textarea id="review-note" rows="3" maxlength="12000"></textarea><div class="draft-status" id="review-draft-status" aria-live="polite"></div></form><div class="review-navigation"><button type="button" id="review-previous-item"><span data-review-i18n="previous">上一项</span><kbd>K</kbd></button><button type="button" id="review-next-item"><span data-review-i18n="next">下一项</span><kbd>J</kbd></button><button type="button" id="review-reopen" data-review-i18n="reopen">重新批注</button></div><details class="review-history"><summary data-review-i18n="history">历史批注</summary><div id="review-history"></div></details></div></section>
</div><div id="review-undo" class="undo-bar" hidden><span id="review-undo-text"></span><button type="button" id="review-undo-button" data-review-i18n="undo">撤销并重新批注</button></div></main>
<dialog id="review-image-dialog"><div class="dialog-heading"><strong data-review-i18n="fullOriginal">完整原图</strong><button type="button" id="review-image-close" data-review-i18n="close">关闭</button></div><div id="review-zoom-content"></div></dialog>
<script src="/case-i18n.js"></script><script src="/review.js"></script></body></html>
