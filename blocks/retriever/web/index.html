<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>截图证据工作台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">证据工作台 <span>v1</span></div><p>检索原文，定位截图，核对事实。</p><span id="health" class="status">正在连接</span></header>
<main><section class="search"><nav><button class="tab active" data-scope="evidence">案件证据</button><button class="tab" data-scope="case_law">类案文书</button><button class="tab" data-scope="statute">法条原文</button></nav>
<form id="search-form"><label id="case-field">案件资料组<select id="case"></select></label><label class="query-label">查找内容<input id="query" placeholder="输入人物、关键词或事件，例如：还款、转账、退款"></label><button type="submit" class="primary">检索</button>
<div id="filters"><label>发言者<select id="person"><option value="">全部发言者</option></select></label><label>事件<select id="event"><option value="">全部事件</option><option value="payment">付款</option><option value="payment_request">请求付款</option><option value="promise">承诺</option><option value="agreement">约定</option><option value="dispute">争议</option><option value="delivery">交付</option></select></label><label>日期起<input type="date" id="after"></label><label>日期止<input type="date" id="before"></label></div></form>
<div class="tools"><span id="summary" aria-live="polite">选择资料组后开始检索。人物身份和不完整时间需人工核对。</span><div><button id="timeline" type="button">查看事件大事记</button> <a id="export" href="#">导出结果 CSV</a></div></div></section>
<div class="workspace"><section class="results" id="results"><div class="empty">原图和全部记录保留，可从检索结果打开引用区域。</div></section><aside><div class="viewer-head"><h2>原图与来源</h2><button id="close-viewer">收起</button></div><p id="source-detail">点击一条结果的“查看原图”。</p><div id="source-tabs"></div><div class="canvas-wrap"><canvas id="canvas" hidden></canvas></div><div id="context"></div></aside></div>
<details class="import"><summary>导入截图</summary><p>选择同一案件的截图。证据页码按本次选择顺序登记，上传后请核对；不同截图的发言者不会自动合并为同一身份。</p><form id="import-form"><label>案件名称<input id="new-case" required placeholder="例如：合同争议01"></label><label>截图文件<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><label class="check"><input id="extract" type="checkbox" checked>同时理解截图内容（调用已配置模型）</label><button class="primary">导入</button></form><p id="job-status" aria-live="polite"></p></details>
</main><footer>模型提取与历史预测均需复核。检索结果保留原文、来源和不确定项。</footer><script src="/app.js"></script></body></html>
