  source_digest: 965479feb3ff143507baeb65c97d57bd1ee5c64b7a40e6706fcd03fff2d739bf
  verification_status: unverified
  text: 第六百七十五条　借款人应当按照约定的期限返还借款。对借款期限没有约定或者约定不明确，依据本法第五百一十条的规定仍不能确定的，借款人可以随时返还；贷款人可以催告借款人在合理期限内返还。
